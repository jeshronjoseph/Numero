<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C6CF0"/>
      <stop offset="100%" stop-color="#5B4FE0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- Numeral "1" — flag, vertical stroke, base — drawn as strokes so it
       renders identically everywhere without relying on an installed font -->
  <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M23 50 L35 40 L35 90"/>
    <path d="M23 90 L47 90"/>
  </g>

  <!-- Arrow: the "becomes" indicator -->
  <g fill="#FFFFFF">
    <rect x="57" y="60" width="20" height="8" rx="3"/>
    <path d="M72 51 L90 64 L72 77 Z"/>
  </g>

  <!-- Letter "A" — two legs meeting at an apex, plus a crossbar -->
  <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M105 40 L92 90"/>
    <path d="M105 40 L118 90"/>
    <path d="M97 70 L113 70"/>
  </g>
</svg>
